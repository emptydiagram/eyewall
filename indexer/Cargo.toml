[package]
name = "eyewall-indexer"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.27"
rocketman = "0.2.0"
serde_json = "1.0.140"
sqlx = { version = "0.8.5", features = [ "chrono", "runtime-tokio", "postgres", "tls-rustls" ] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
